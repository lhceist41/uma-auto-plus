name: Repository hygiene

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene:
    name: Check tracked paths
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      # The check reads `git ls-files` only. It needs no dependencies, no Android
      # SDK, and no build, so it stays fast and cannot be broken by an unrelated
      # toolchain failure.
      - name: Check repository hygiene
        run: yarn test:hygiene
