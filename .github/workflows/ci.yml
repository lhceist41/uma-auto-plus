name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript and Jest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The Jest suites spawn scripts/*.mjs CLIs that import TypeScript .ts source directly. Node only
      # loads those imports where type-stripping is on by default (>= 22.18 / >= 23.6); on Node 20 they
      # throw ERR_UNKNOWN_FILE_EXTENSION, which is what reddened these suites in CI while they passed on
      # newer local Node. scriptToolchainNode.test.ts guards this pin from drifting back below that line.
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: node_modules/.bin/tsc --noEmit

      # A Kotlin settings read is a string lookup, so a renamed or deleted Settings field keeps
      # compiling and silently returns the caller's default forever. Neither tsc nor ktlint sees it.
      - name: Settings contract parity
        run: yarn test:settings-parity

      - name: Jest
        run: yarn jest --ci

      # Proves the checked-in Grand Concert fan-runtime asset is regenerated whenever its root data
      # changes. Narrow by design: only this generator's test runs here (it uses node:test + node:fs
      # and is Node 20 compatible), NOT a scripts/*.test.mjs glob that would pull in node:sqlite tooling.
      - name: Grand Concert fan-runtime asset freshness
        run: |
          node --test scripts/generate-gc-fan-runtime-data.test.mjs
          node scripts/generate-gc-fan-runtime-data.mjs --check

      # Same contract for the Veteran identity asset: the character/outfit domain the roster reader
      # matches against must never drift from src/data/characters.json + character_outfits.json.
      - name: Veteran identity asset freshness
        run: |
          node --test scripts/generate-veteran-identity-data.test.mjs
          node scripts/generate-veteran-identity-data.mjs --check

      # Same contract for the Veteran factor-name domain: the canonical skill/race/scenario names the
      # Inspiration reader snaps its factor OCR onto must never drift from src/data skills/races/scenarios.
      - name: Veteran factor domain asset freshness
        run: |
          node --test scripts/generate-veteran-factor-domain.test.mjs
          node scripts/generate-veteran-factor-domain.mjs --check

  android:
    name: Kotlin unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'yarn'

      # The Gradle settings script resolves the React Native and Expo plugins through node, so
      # the JS dependencies must be installed even though no bundle is built in this job.
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Fetch and verify Gradle wrapper
        run: node scripts/bootstrap-gradle-wrapper.mjs

      # testDebugUnitTest runs every JVM unit test once and compiles the debug Kotlin on the way.
      # Debug variants skip JS bundling, so no bundle step is needed here; the release build path
      # is exercised by the tag-triggered Build APK workflow.
      - name: Kotlin unit tests
        run: |
          cd android
          ./gradlew testDebugUnitTest --console=plain
